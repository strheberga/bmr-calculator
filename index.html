<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>BMR Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>BMR Hesaplama</h2>
        <div class="input-group">
            <label>Cinsiyet:</label>
            <select id="gender">
                <option value="male">Erkek</option>
                <option value="female">Kadın</option>
            </select>
        </div>
        <div class="input-group">
            <label>Yaş:</label>
            <input type="number" id="age" placeholder="Örn: 25">
        </div>
        <div class="input-group">
            <label>Boy (cm):</label>
            <input type="number" id="height" placeholder="Örn: 177">
        </div>
        <div class="input-group">
            <label>Kilo (kg):</label>
            <input type="number" id="weight" placeholder="Örn: 90">
        </div>
        <!-- Kilo girişinden hemen sonra ekle -->
<div class="input-group">
    <label>Günlük Adım Sayısı:</label>
    <input type="number" id="steps" placeholder="Örn: 10000">
</div>
        <button onclick="calculateBMR()">Hesapla</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
