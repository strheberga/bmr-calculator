<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Performance Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PERFORMANCE LAB</h1>
            <p>Bilimsel Veri ve Fiziksel Takip</p>
        </header>
        
        <div class="grid-inputs">
            <div class="input-group">
                <label>Cinsiyet</label>
                <select id="gender">
                    <option value="male">Erkek</option>
                    <option value="female">Kadın</option>
                </select>
            </div>
            <div class="input-group">
                <label>Yaş</label>
                <input type="number" id="age" placeholder="25">
            </div>
            <div class="input-group">
                <label>Boy (cm)</label>
                <input type="number" id="height" placeholder="177">
            </div>
            <div class="input-group">
                <label>Kilo (kg)</label>
                <input type="number" id="weight" placeholder="91">
            </div>
        </div>

        <div class="input-group full-width">
            <label>Günlük Adım Aktivitesi (NEAT)</label>
            <input type="range" id="steps" min="0" max="30000" step="500" value="20000" oninput="this.nextElementSibling.value = this.value">
            <output>20000</output>
        </div>

        <div class="input-group full-width">
            <label>Haftalık Hedef</label>
            <select id="goal">
                <option value="0">Kiloyu Koru (Maintenance)</option>
                <option value="350">Yağ Yakımı - Hafif (0.3 kg/hafta)</option>
                <option value="500" selected>Yağ Yakımı - Optimal (0.5 kg/hafta)</option>
                <option value="1000">Yağ Yakımı - Agresif (1.0 kg/hafta)</option>
                <option value="-300">Lean Bulk (Kas Kazanımı)</option>
            </select>
        </div>

        <button onclick="calculatePerformance()">ANALİZ ET</button>

        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
